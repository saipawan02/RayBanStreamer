[project]
name = "glasses-reader"
version = "0.1.0"
description = "GPU readers, alignment and calibration for Ray-Ban Meta sessions (TECH-05)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=16", "scipy>=1.11"]

[project.optional-dependencies]
# PyAV is the CPU reference backend and is also used for audio decode and timestamps.
cpu = ["av>=12"]
# Install torch separately to match your CUDA version (https://pytorch.org); GStreamer and
# PyGObject (live reader) come from the OS package manager, not pip.
dev = ["pytest>=8", "ruff>=0.5", "av>=12"]

[tool.setuptools.packages.find]
include = ["glasses_reader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
